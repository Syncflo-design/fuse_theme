[project]
name = "fuse_theme"
authors = [{ name = "Syncflo", email = "ops@syncflo.co.za" }]
description = "Fuse Manufacturing look and feel for Frappe/ERPNext v16 — Sage Intacct inspired, green base."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe Cloud reads this to decide which bench versions the app may be added to.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.flit.module]
name = "fuse_theme"
